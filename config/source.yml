# Config-driven extract. Swap these values for any REST API; the pipeline reads
# source_name, primary_key, and target_column downstream.
#
# Active source: Alpha Vantage TIME_SERIES_DAILY. Predict each symbol's
# NEXT-day close from current + lagged OHLCV features.
#
# SECRETS: never put the key here (this file is committed). `auth_params` maps a
# query param -> the NAME of an env var holding the value. Before running:
#   export ALPHAVANTAGE_API_KEY=...     # free key from alphavantage.co

source_name: alphavantage_daily         # -> DuckDB table raw.alphavantage_daily
base_url: "https://www.alphavantage.co/query"

# Query-param auth: param name -> env var name (value read at runtime).
auth_params:
  apikey: ALPHAVANTAGE_API_KEY

# Static query params sent on every request.
params:
  function: TIME_SERIES_DAILY
  outputsize: compact                    # last 100 rows (full is premium-only)
  datatype: json

# Alpha Vantage returns ONE symbol per request, so the extractor loops over
# these, issuing a request each and tagging rows with the symbol. Kept to 5 to
# stay under the free tier's 25 requests/day.
per_symbol:
  symbols: [AAPL, MSFT, GOOGL, AMZN, TSLA]
  symbol_param: symbol                   # request param carrying the ticker
  symbol_key: symbol                     # column to store the ticker in
  delay_seconds: 15                      # spacing to respect ~5 req/min

# Response shape: {"Time Series (Daily)": {"2024-01-02": {"1. open": ...}, ...}}
# i.e. a dict keyed by date. `date_dict` flattens it, storing the key as
# `date_key` and the "N. field" values as columns (renamed in staging).
record_style: date_dict
record_path: "Time Series (Daily)"
date_key: bar_date

# Row identity for idempotent upsert + dedup (composite key).
primary_key: [symbol, bar_date]

# The value XGBoost will predict (derived in the mart as lead(close)).
target_column: next_close
