[project]
name = "claude-code-project"
version = "0.1.0"
description = "API -> DuckDB -> dbt -> XGBoost price-prediction pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "requests>=2.32",
    "duckdb>=1.1",
    "dbt-duckdb>=1.9",
    "xgboost>=2.1",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "pyarrow>=17",
    "pyyaml>=6.0",
]

[tool.uv]
package = false
