version: 2

models:
  - name: fct_prices
    description: "Fact: one row per (symbol, bar_date). Target next_close feeds the model."
    columns:
      - name: symbol
        description: "Ticker. FK to dim_symbol."
        tests:
          - not_null
          - relationships:
              to: ref('dim_symbol')
              field: symbol
      - name: bar_date
        description: "Bar date (with symbol, the grain)."
        tests:
          - not_null
      - name: next_close
        description: "Next trading day's close - the value XGBoost predicts."
        tests:
          - not_null

  - name: dim_symbol
    description: "Dimension: one row per symbol with its history window."
    columns:
      - name: symbol
        tests:
          - not_null
          - unique
