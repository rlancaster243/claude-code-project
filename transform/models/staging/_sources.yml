version: 2

sources:
  - name: raw
    schema: raw
    description: "Landing zone written by extract/extract.py (untransformed)."
    tables:
      - name: alpaca_stock_bars
        description: "Raw Alpaca daily bars, one row per (symbol, timestamp)."
        columns:
          - name: symbol
            description: "Ticker symbol (part of primary key)."
            tests:
              - not_null
          - name: t
            description: "Bar timestamp (ISO 8601, part of primary key)."
            tests:
              - not_null
