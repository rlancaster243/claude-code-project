version: 2

sources:
  - name: raw
    schema: raw
    description: "Landing zone written by extract/extract.py (untransformed)."
    tables:
      - name: alphavantage_daily
        description: "Raw Alpha Vantage TIME_SERIES_DAILY bars, one row per (symbol, bar_date)."
        columns:
          - name: symbol
            description: "Ticker symbol (part of primary key)."
            tests:
              - not_null
          - name: bar_date
            description: "Bar date (part of primary key)."
            tests:
              - not_null
